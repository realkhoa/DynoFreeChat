name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Point the bundle at the worker
        env:
          WS_URL: ${{ vars.VITE_WS_URL }}
        run: |
          if [ -n "$WS_URL" ]; then
            printf 'VITE_WS_URL=%s\n' "$WS_URL" > web/.env.production
            echo "VITE_WS_URL baked into the build"
          else
            echo "::warning::Repository variable VITE_WS_URL is empty — the deployed page will point at ws://localhost:8787/ws"
          fi

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
